[workspace]
resolver = "2"
default-members = ["crates/mu-cli"]
members = [
    "crates/mu-core",
    "crates/mu-session",
    "crates/mu-runtime-deno",
    "crates/mu-cli",
    "crates/mu-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "process", "signal", "sync", "time"] }
url = "2"
